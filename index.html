<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, minimum-scale=1.0, maximum-scale=2.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Herramienta de proyección de inversiones que permite simular y visualizar el crecimiento de tus inversiones en el tiempo" />
  <title>Proyección de Inversiones</title>

  <style>
    html {
      background-color: #0a0f1e !important;
    }
    body.no-fouc {
      opacity: 0;
      pointer-events: none;
      transition: none !important;
      will-change: opacity;
    }
    body {
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      transition: opacity 0.3s ease-in;
    }
    body:not(.no-fouc) {
      opacity: 1;
      pointer-events: auto;
    }

    .svg-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1em;
      height: 1em;
      vertical-align: middle;
      margin-right: 0.25em;
    }
    .svg-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .rotating {
      animation: rotate 1s linear infinite;
      transform-origin: center center;
      will-change: transform;
    }

    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      requestAnimationFrame(function() {
        requestAnimationFrame(function() {
           if (document.body) {
               document.body.classList.remove('no-fouc');
           }
        });
      });
    });
  </script>

  <link rel="preload" href="styles.css" as="style">
  <link rel="stylesheet" href="styles.css">

  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"></noscript>

  <link rel="icon" href="assets/piggy.svg" type="image/svg+xml" />
</head>
<body class="no-fouc is-loading">
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="icon-trending-up" viewBox="0 0 24 24">
      <path d="M16,6L18.29,8.29L13.41,13.17L9.41,9.17L2,16.59L3.41,18L9.41,12L13.41,16L19.71,9.71L22,12V6H16Z" />
    </symbol>
    <symbol id="icon-trending-down" viewBox="0 0 24 24">
      <path d="M16,18L18.29,15.71L13.41,10.83L9.41,14.83L2,7.41L3.41,6L9.41,12L13.41,8L19.71,14.29L22,12V18H16Z" />
    </symbol>
    <symbol id="icon-trending-neutral" viewBox="0 0 24 24">
      <path d="M22,12L18,8V11H3V13H18V16L22,12Z" />
    </symbol>
    <symbol id="icon-chart" viewBox="0 0 24 24">
      <path d="M22,21H2V3H4V19H22V21M14,10V17H12V10H14M10,13V17H8V13H10M18,7V17H16V7H18M6,16V17H4V16H6Z" />
    </symbol>
    <symbol id="icon-document" viewBox="0 0 24 24">
      <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20M9,13V18.5L12,15.7L15,18.5V13H9Z" />
    </symbol>
    <symbol id="icon-warning" viewBox="0 0 24 24">
      <path d="M13,14H11V10H13V14M13,18H11V16H13V18M1,21H23L12,2L1,21Z" />
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20A8,8 0 0,0 20,12A8,8 0 0,0 12,4M11,16.5L6.5,12L7.91,10.59L11,13.67L16.59,8.09L18,9.5L11,16.5Z" />
    </symbol>
    <symbol id="icon-timeline" viewBox="0 0 24 24">
      <path d="M2,2H4V20H22V22H2V2M7,10H17V13H7V10M11,15H21V18H11V15M9,5H19V8H9V5Z" />
    </symbol>
    <symbol id="icon-info" viewBox="0 0 24 24">
      <path d="M13,9H11V7H13M13,17H11V11H13M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z" />
    </symbol>
    <symbol id="icon-error" viewBox="0 0 24 24">
      <path d="M12,2C17.53,2 22,6.47 22,12C22,17.53 17.53,22 12,22C6.47,22 2,17.53 2,12C2,6.47 6.47,2 12,2M15.59,7L12,10.59L8.41,7L7,8.41L10.59,12L7,15.59L8.41,17L12,13.41L15.59,17L17,15.59L13.41,12L17,8.41L15.59,7Z" />
    </symbol>
    <symbol id="icon-touch" viewBox="0 0 24 24">
      <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M11.5,7H12.5V13H11.5V7M11.5,15H12.5V17H11.5V15Z" />
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24">
      <path d="M17.65,6.35C16.2,4.9 14.21,4 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20C15.73,20 18.84,17.45 19.73,14H17.65C16.83,16.33 14.61,18 12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6C13.66,6 15.14,6.69 16.22,7.78L13,11H20V4L17.65,6.35Z" />
    </symbol>
  </svg>

  <div class="app-container">
    <main class="main-content">
      <div class="dashboard-content">
        <section class="summary-cards">
           <!-- Tarjeta Meta movida a la primera posición y hecha full-width -->
           <div class="summary-card full-width">
            <div class="summary-info">
              <h3 class="text-sm font-medium text-secondary">Meta: 2 millones</h3>
              <p class="summary-value text-xl font-semibold" id="meta-tiempo">Calculando...</p>
              <p class="summary-trend positive" id="meta-descripcion">
                <span class="svg-icon"><svg><use xlink:href="#icon-timeline"></use></svg></span>
                 <!-- El texto se actualizará por JS -->
              </p>
            </div>
          </div>
          <!-- Tarjeta Inversión Total movida a la segunda fila, primera posición (sin full-width) -->
          <div class="summary-card">
            <div class="summary-info">
              <h3 class="text-sm font-medium text-secondary">Inversión Total</h3>
              <p class="summary-value text-xl font-semibold" id="total-inversion">S/ 0.00</p>
               <p class="summary-trend positive" id="inversion-trend"> <!-- Añadido id="inversion-trend" -->
                 <span class="svg-icon"><svg><use xlink:href="#icon-trending-up"></use></svg></span>
                 <!-- El texto se actualizará por JS -->
               </p>
            </div>
          </div>
          <!-- Tarjeta Tasa Promedio movida a la segunda fila, segunda posición -->
          <div class="summary-card">
            <div class="summary-info">
              <h3 class="text-sm font-medium text-secondary">Tasa Promedio</h3>
              <p class="summary-value text-xl font-semibold" id="tasa-promedio">0.00%</p>
              <p class="summary-trend positive" id="tasa-trend"> <!-- Cambiado 'neutral' a 'positive' y añadido id -->
                <span class="svg-icon"><svg><use xlink:href="#icon-trending-up"></use></svg></span> <!-- Cambiado icono -->
                 Anualizada
              </p>
            </div>
          </div>
        </section>

        <section class="chart-container card">
          <div class="card-header flex-between">
            <div class="header-left flex">
              <span class="svg-icon" style="color: var(--color-accent-tertiary);">
                <svg><use xlink:href="#icon-chart"></use></svg>
              </span>
              <h4>Proyección</h4>
            </div>
            <div class="header-right chart-legend-container">
              <!-- El interruptor se generará aquí por JS -->
            </div>
          </div>
          <canvas id="proyeccion-chart"></canvas>
        </section>

        <section class="investment-card card">
          <div class="card-header flex-between">
            <div class="header-left flex">
              <span class="svg-icon" style="color: var(--color-accent-tertiary);">
                <svg><use xlink:href="#icon-document"></use></svg>
              </span>
              <h4>Factoring</h4>
            </div>
            <div class="header-right text-sm font-medium text-secondary" id="factoring-contracts-count">
                <span>Contando...</span>
            </div>
          </div>
          <div class="tabs-container">
            <div class="tab" data-tab="pending">Pendientes</div>
            <div class="tab" data-tab="paid">Pagados</div>
            <div class="tab" data-tab="all">Todos</div>
          </div>
          <div class="card-details">
            <table class="details-table">
              <thead>
                <tr>
                  <th>Cliente</th>
                  <th>Fecha Pago</th>
                  <th>Ganancia</th>
                </tr>
              </thead>
              <tbody id="factoring-details">
                 <tr class="waiting-state-row">
                   <td colspan="3">
                     <div class="empty-state waiting-message">
                       <span class="svg-icon">
                         <svg><use xlink:href="#icon-touch"></use></svg>
                       </span>
                       <p class="primary-text">Selecciona una categoría</p>
                       <p class="secondary-text">Haz clic en una de las pestañas superiores para ver los contratos</p>
                     </div>
                   </td>
                 </tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="js/utils.js" defer></script>
  <script src="js/lazyLoader.js" defer></script>
  <script src="js/dataService.js" defer></script>
  <script src="js/charts.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
